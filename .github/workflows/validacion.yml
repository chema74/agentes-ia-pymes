name: Validacion tecnica

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias de calidad
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Ejecutar validacion global
        run: python scripts/validar_repositorio.py

      - name: Ejecutar ruff
        run: ruff check .

      - name: Ejecutar mypy (scripts/tests)
        run: mypy scripts tests

  tests:
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias de tests
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Ejecutar tests con cobertura
        run: python -m pytest -v --cov=scripts --cov=tests --cov-report=term-missing

  security:
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar herramientas de seguridad
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Auditoria de dependencias
        run: pip-audit --progress-spinner off
