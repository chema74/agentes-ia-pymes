name: Validacion tecnica

on:
  push:
  pull_request:

jobs:
  validacion:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Ejecutar validacion global
        run: python scripts/validar_repositorio.py

      - name: Ejecutar verificacion UTF-8
        run: python scripts/verificar_utf8.py

      - name: Ejecutar tests con pytest (repo completo)
        run: |
          pip install pytest
          python -m pytest -v
