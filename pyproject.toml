[project]
name = "agentes-ia-pymes"
version = "2.0.0"
requires-python = ">=3.11"
description = "Repositorio tecnico de agentes IA locales para PYMES"
license = { text = "CC BY-SA 4.0" }

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6.0",
  "mypy>=1.11",
  "pip-audit>=2.7",
  "pre-commit>=3.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "salidas",
  "espacio_trabajo",
  ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
exclude = "(^agentes/.*/tests/|^salidas/|^espacio_trabajo/)"

[tool.coverage.run]
source = ["scripts", "tests"]
omit = [
  "*/__pycache__/*",
  "*/.venv/*",
  "agentes/*",
]

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_covered = false
